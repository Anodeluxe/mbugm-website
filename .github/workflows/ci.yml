name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@ep-ci.us-east-1.aws.neon.tech/ci?sslmode=require
      AUTH_SECRET: ci-only-secret-not-used-in-production
      AUTH_GOOGLE_ID: ci-google-id
      AUTH_GOOGLE_SECRET: ci-google-secret
      ADMIN_ALLOWED_EMAILS: admin@example.com
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ci@example.iam.gserviceaccount.com
      GOOGLE_PRIVATE_KEY: ci-only-placeholder
      GOOGLE_DRIVE_FOLDER_ID: ci-drive-folder
      GOOGLE_DRIVE_IMAGES_FOLDER_ID: ci-images-folder
      GOOGLE_SHEET_ID: ci-sheet
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      LOCAL_FORM_MOCK: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
